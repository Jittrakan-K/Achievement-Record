<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mobile Device Simulator — iOS & Android</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64' width='64' height='64'%3E%3Crect width='64' height='64' rx='14' fill='%23E60012'/%3E%3Crect x='11' y='11' width='42' height='42' rx='5' fill='none' stroke='%23ffffff' stroke-width='5.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M25 11v42M11 25h42' fill='none' stroke='%23ffffff' stroke-width='5.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="icon" type="image/svg+xml" href="favicon.svg?v=20261003_v1">
  <link rel="alternate icon" type="image/png" href="favicon.png?v=20261003_v1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-studio: #0d1117;
      --bg-toolbar: #161b22;
      --border-toolbar: #30363d;
      --text-main: #f0f6fc;
      --text-muted: #8b949e;
      --accent-active: #58a6ff;
      --font-ui: 'Inter', 'Sarabun', -apple-system, BlinkMacSystemFont, sans-serif;
      --device-scale: 0.90;
      --titanium-edge: #2d333b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-ui);
      background-color: var(--bg-studio);
      background-image: 
        linear-gradient(to right, rgba(255, 255, 255, 0.02) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
      background-size: 24px 24px;
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      user-select: none;
    }

    /* --- Top Control Toolbar (2D Flat, Sleek & Clean) --- */
    .simulator-toolbar {
      position: sticky;
      top: 0;
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 8px 16px;
      height: 48px;
      background: var(--bg-toolbar);
      border-bottom: 1px solid var(--border-toolbar);
    }

    .toolbar-left, .toolbar-center, .toolbar-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brand-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      padding-right: 12px;
      border-right: 1px solid var(--border-toolbar);
    }

    .brand-logo-orbray {
      width: 24px;
      height: 24px;
      border-radius: 4px;
      background: #21262d;
      border: 1px solid var(--border-toolbar);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #c9d1d9;
    }

    .brand-title {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.2px;
      color: #f0f6fc;
      line-height: 1;
    }

    /* OS Toggle Segmented Control (Pure 2D Flat) */
    .os-segmented-control {
      display: flex;
      background: #0d1117;
      border: 1px solid var(--border-toolbar);
      border-radius: 6px;
      padding: 2px;
      gap: 2px;
    }

    .os-tab-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4px 10px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: 500;
      color: var(--text-muted);
      background: transparent;
      border: none;
      cursor: pointer;
      transition: background 0.15s ease, color 0.15s ease;
    }

    .os-tab-btn:hover {
      color: #f0f6fc;
    }

    .os-tab-btn.active {
      background: #21262d;
      color: #58a6ff;
      font-weight: 600;
    }

    /* Device Dropdown (2D Flat) */
    .toolbar-select-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .toolbar-select {
      background: #0d1117;
      color: #f0f6fc;
      border: 1px solid var(--border-toolbar);
      border-radius: 6px;
      padding: 5px 24px 5px 10px;
      font-size: 12px;
      font-weight: 500;
      outline: none;
      cursor: pointer;
      appearance: none;
      height: 30px;
      transition: border-color 0.15s ease;
      max-width: 230px;
    }

    .toolbar-select optgroup {
      background: #161b22;
      color: #58a6ff;
      font-weight: 600;
    }

    .toolbar-select option {
      background: #0d1117;
      color: #f0f6fc;
      font-weight: 400;
    }

    .toolbar-select:hover, .toolbar-select:focus {
      border-color: #58a6ff;
    }

    .toolbar-select-icon {
      position: absolute;
      right: 8px;
      pointer-events: none;
      font-size: 9px;
      color: var(--text-muted);
    }

    /* Standard Toolbar Buttons (2D Flat) */
    .tool-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 0 10px;
      height: 30px;
      background: #21262d;
      border: 1px solid var(--border-toolbar);
      border-radius: 6px;
      color: #c9d1d9;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease;
      white-space: nowrap;
      text-decoration: none;
    }

    .tool-btn:hover {
      background: #30363d;
      color: #f0f6fc;
      border-color: #8b949e;
    }

    .tool-btn:active {
      background: #161b22;
    }

    .tool-btn.active {
      background: #1f2937;
      border-color: #388bfd;
      color: #58a6ff;
    }

    /* Dimension Pill (2D Flat Subtle Badge) */
    .status-pill {
      font-size: 11px;
      font-family: ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace;
      color: #8b949e;
      background: #0d1117;
      border: 1px solid var(--border-toolbar);
      padding: 4px 8px;
      border-radius: 4px;
      font-weight: 500;
      white-space: nowrap;
    }

    /* --- Simulator Stage Area --- */
    .simulator-stage {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 24px 20px 60px;
      overflow-y: auto;
      overflow-x: auto;
      position: relative;
    }

    /* Scaling Container */
    .device-scale-wrapper {
      transform: scale(var(--device-scale));
      transform-origin: top center;
      transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      position: relative;
      margin-bottom: 40px;
    }

    /* --- Physical Phone Chassis Design --- */
    .phone-chassis {
      position: relative;
      background: #11141a;
      border-radius: 54px;
      padding: 12px;
      box-shadow: 
        0 0 0 4px var(--titanium-edge),
        0 0 0 7px #090c12,
        0 25px 60px -10px rgba(0, 0, 0, 0.75),
        0 10px 25px -5px rgba(0, 0, 0, 0.5);
      transition: all 0.3s ease;
      overflow: hidden;
    }

    /* Bezel Off Mode (Frameless) */
    .phone-chassis.frameless {
      border-radius: 12px !important;
      padding: 0 !important;
      box-shadow: 0 15px 45px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 255, 255, 0.15) !important;
    }

    .phone-chassis.frameless .phone-status-bar,
    .phone-chassis.frameless .dynamic-island-container,
    .phone-chassis.frameless .classic-notch-container,
    .phone-chassis.frameless .compact-notch-container,
    .phone-chassis.frameless .punch-hole-camera,
    .phone-chassis.frameless .ios-home-indicator-bar,
    .phone-chassis.frameless .android-nav-bar,
    .phone-chassis.frameless .iphone-se-top-bar,
    .phone-chassis.frameless .iphone-se-bottom-bar {
      display: none !important;
    }

    /* Phone Screen Window */
    .phone-screen {
      position: relative;
      width: 393px;
      height: 852px;
      background: #ffffff;
      border-radius: 44px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: width 0.25s ease, height 0.25s ease, border-radius 0.25s ease;
    }

    .phone-chassis.frameless .phone-screen {
      border-radius: 12px !important;
    }

    /* --- iOS Status Bar --- */
    .ios-status-bar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 44px;
      z-index: 999;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      font-size: 13.5px;
      font-weight: 700;
      color: #0f172a;
      pointer-events: none;
      background: #ffffff;
    }

    .ios-status-time {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: -0.2px;
    }

    .ios-status-icons {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    /* Dynamic Island (iPhone 14 Pro, 15, 16) */
    .dynamic-island-container {
      position: absolute;
      top: 8px;
      left: 50%;
      transform: translateX(-50%);
      width: 120px;
      height: 30px;
      background: #000000;
      border-radius: 20px;
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .dynamic-island-container:hover {
      width: 138px;
    }

    .dynamic-island-camera {
      width: 10px;
      height: 10px;
      background: #111b27;
      border: 2px solid #0d1219;
      border-radius: 50%;
    }

    .dynamic-island-sensor {
      width: 10px;
      height: 10px;
      background: #06090e;
      border-radius: 50%;
    }

    /* Classic Apple Notch (iPhone 11, 11 Pro, 11 Pro Max, 12, 12 Pro) */
    .classic-notch-container {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 210px;
      height: 30px;
      background: #000000;
      border-bottom-left-radius: 18px;
      border-bottom-right-radius: 18px;
      z-index: 1000;
      display: none;
      align-items: center;
      justify-content: center;
      gap: 12px;
      pointer-events: none;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.3);
    }

    /* Compact Apple Notch (iPhone 13, 13 mini, 13 Pro, 14, 14 Plus) */
    .compact-notch-container {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 160px;
      height: 30px;
      background: #000000;
      border-bottom-left-radius: 18px;
      border-bottom-right-radius: 18px;
      z-index: 1000;
      display: none;
      align-items: center;
      justify-content: center;
      gap: 10px;
      pointer-events: none;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.3);
    }

    .notch-speaker-slit {
      width: 48px;
      height: 4px;
      background: #1e293b;
      border-radius: 3px;
    }

    .notch-camera-dot {
      width: 10px;
      height: 10px;
      background: #111b27;
      border: 1.5px solid #0d1219;
      border-radius: 50%;
    }

    /* iOS Bottom Home Bar */
    .ios-home-indicator-bar {
      position: absolute;
      bottom: 8px;
      left: 50%;
      transform: translateX(-50%);
      width: 138px;
      height: 5px;
      background: #0f172a;
      border-radius: 10px;
      z-index: 999;
      pointer-events: none;
      opacity: 0.85;
      transition: opacity 0.2s ease;
    }

    /* iPhone SE Forehead and Chin */
    .iphone-se-top-bar {
      height: 60px;
      background: #11141a;
      display: none;
      align-items: center;
      justify-content: center;
      gap: 16px;
    }

    .iphone-se-bottom-bar {
      height: 70px;
      background: #11141a;
      display: none;
      align-items: center;
      justify-content: center;
    }

    .iphone-se-home-ring {
      width: 48px;
      height: 48px;
      border: 2px solid #334155;
      border-radius: 50%;
      background: #090c12;
      box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.6);
    }

    /* --- Android Specific Styling --- */
    .os-android .phone-chassis {
      border-radius: 36px;
      box-shadow: 
        0 0 0 3px #334155,
        0 0 0 6px #0f172a,
        0 25px 65px -10px rgba(0, 0, 0, 0.8);
    }

    .punch-hole-camera {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      width: 14px;
      height: 14px;
      background: #000;
      border: 1.5px solid #1e293b;
      border-radius: 50%;
      z-index: 1000;
      pointer-events: none;
      display: none;
    }

    .android-status-bar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 34px;
      z-index: 999;
      display: none;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      font-size: 12px;
      font-weight: 600;
      color: #1e293b;
      pointer-events: none;
      background: #ffffff;
    }

    .android-status-left {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .android-status-right {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
    }

    .android-nav-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 24px;
      z-index: 999;
      display: none;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      background: transparent;
    }

    .android-gesture-pill {
      width: 72px;
      height: 4px;
      background: #334155;
      border-radius: 6px;
    }

    /* Main Iframe */
    .phone-viewport-iframe {
      width: 100%;
      height: 100%;
      border: none;
      background: #ffffff;
      flex: 1;
      display: block;
    }

    /* Floating Shortcuts Bar (2D Flat) */
    .shortcuts-bar {
      position: fixed;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      display: flex;
      align-items: center;
      gap: 12px;
      background: #161b22;
      border: 1px solid var(--border-toolbar);
      border-radius: 6px;
      padding: 5px 14px;
      font-size: 11px;
      color: #8b949e;
    }

    .shortcut-tag {
      color: #f0f6fc;
      font-weight: 600;
      background: #21262d;
      border: 1px solid var(--border-toolbar);
      padding: 1px 5px;
      border-radius: 3px;
      margin-right: 4px;
      font-family: monospace;
    }

    /* Toast Notification (2D Flat) */
    .simulator-toast {
      position: fixed;
      top: 58px;
      left: 50%;
      transform: translateX(-50%) translateY(-8px);
      background: #161b22;
      color: #f0f6fc;
      border: 1px solid var(--border-toolbar);
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 11.5px;
      font-weight: 500;
      opacity: 0;
      pointer-events: none;
      transition: all 0.2s ease;
      z-index: 2000;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .simulator-toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    @media (max-width: 900px) {
      .brand-title, .status-pill, .shortcuts-bar {
        display: none !important;
      }
      .toolbar-select {
        max-width: 170px !important;
      }
    }

    @media (max-width: 650px) {
      #rotateBtn span, #bezelBtn span, a.tool-btn span, button.tool-btn span {
        display: none !important;
      }
      .tool-btn {
        padding: 0 8px !important;
      }
    }
  </style>
</head>
<body class="os-ios">

  <!-- Top Toolbar (Pure 2D Flat & Clean) -->
  <header class="simulator-toolbar">
    <div class="toolbar-left">
      <div class="brand-badge">

        </div>
        <span class="brand-title">Simulator</span>
      </div>

      <!-- OS Switcher (Flat 2D Segmented) -->
      <div class="os-segmented-control">
        <button type="button" class="os-tab-btn active" data-os="ios" onclick="switchOS('ios')">iOS</button>
        <button type="button" class="os-tab-btn" data-os="android" onclick="switchOS('android')">Android</button>
      </div>

            <option value="iphone15plus">iPhone 15 Plus (430 × 932)</option>
          </optgroup>
          <optgroup label="iPhone 14 Series">
            <option value="iphone14pro">iPhone 14 Pro (393 × 852)</option>
            <option value="iphone14promax">iPhone 14 Pro Max (430 × 932)</option>

            <option value="iphone14plus">iPhone 14 Plus (428 × 926)</option>

            <option value="iphone13">iPhone 13 (390 × 844)</option>
            <option value="iphone13mini">iPhone 13 mini (375 × 812)</option>
          </optgroup>

            <option value="iphone12pro">iPhone 12 Pro (390 × 844)</option>
            <option value="iphone12promax">iPhone 12 Pro Max (428 × 926)</option>
            <option value="iphone12">iPhone 12 (390 × 844)</option>
            <option value="iphone12mini">iPhone 12 mini (375 × 812)</option>
          </optgroup>

            <option value="iphone11">iPhone 11 (414 × 896)</option>

        <span class="toolbar-select-icon">▾</span>
      </div>

      <!-- Dimension Badge -->
      <span id="dimensionPill" class="status-pill">393 × 852 px</span>
    </div>

    <!-- Center Quick Actions -->
    <div class="toolbar-center">
      <!-- Reload Button -->
      <button type="button" class="tool-btn" onclick="reloadPreview()" title="รีเฟรชหน้าเว็บ (R)">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M21 2v6h-6M3 12a9 9 0 0 1 15-6.7L21 8M3 22v-6h6M21 12a9 9 0 0 1-15 6.7L3 16"/></svg>
        <span>รีเฟรช</span>
      </button>

      <!-- Rotate Orientation Button -->
      <button type="button" id="rotateBtn" class="tool-btn" onclick="toggleOrientation()" title="สลับแนวตั้ง / แนวนอน (P)">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.5 2v6h-6M2.5 22v-6h6M2 11.5a10 10 0 0 1 18.8-4.3M22 12.5a10 10 0 0 1-18.8 4.3"/></svg>
        <span id="orientationLabel">แนวตั้ง</span>
      </button>

      <!-- Toggle Bezel Frame -->
      <button type="button" id="bezelBtn" class="tool-btn active" onclick="toggleBezel()" title="เปิด/ปิด กรอบตัวเครื่อง (B)">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="2" width="14" height="20" rx="3"/><path d="M12 18h.01"/></svg>
        <span>กรอบเครื่อง: เปิด</span>
      </button>
    </div>

    <!-- Right Controls: Zoom & Direct Open -->
    <div class="toolbar-right">
      <div class="toolbar-select-wrapper">
        <select id="scaleSelector" class="toolbar-select" onchange="changeScale(this.value)">
          <option value="fit" selected>พอดีจอ (Fit)</option>
          <option value="1.0">100%</option>
          <option value="0.9">90%</option>
          <option value="0.8">80%</option>
          <option value="0.7">70%</option>
          <option value="0.5">50%</option>
        </select>
        <span class="toolbar-select-icon">▾</span>
      </div>

      <a href="index.html" target="_blank" class="tool-btn" title="เปิดหน้าเว็บในแท็บใหม่">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6M15 3h6v6M10 14L21 3"/></svg>
        <span>เปิดแท็บใหม่</span>
      </a>
    </div>
  </header>

  <!-- Simulator Main Stage Area -->
  <main class="simulator-stage" id="simulatorStage">
    <div class="device-scale-wrapper" id="scaleWrapper">
      
      <!-- Physical Phone Chassis Container -->
      <div class="phone-chassis" id="phoneChassis">

        <!-- iPhone SE Forehead Bar -->
        <div class="iphone-se-top-bar" id="iphoneSeTop">
          <div class="notch-speaker-slit" style="width: 55px; height: 5px;"></div>
          <div class="notch-camera-dot"></div>
        </div>

        <div class="phone-screen" id="phoneScreen">
          
          <!-- === iOS Status Elements === -->
          <div class="ios-status-bar" id="iosStatusBar">
            <span class="ios-status-time" id="liveClock">09:41</span>
            <div class="ios-status-icons">
              <!-- Cell Signal -->
              <svg width="16" height="11" viewBox="0 0 16 11" fill="currentColor"><rect x="0" y="7" width="2.5" height="4" rx="0.5"/><rect x="4" y="5" width="2.5" height="6" rx="0.5"/><rect x="8" y="2.5" width="2.5" height="8.5" rx="0.5"/><rect x="12" y="0" width="2.5" height="11" rx="0.5"/></svg>
              <!-- 5G Badge -->
              <span id="networkBadge" style="font-size: 10px; font-weight: 800; margin-left: 2px;">5G</span>
              <!-- Battery -->
              <svg width="22" height="11" viewBox="0 0 22 11" fill="currentColor" style="margin-left: 4px;"><rect x="0" y="0" width="19" height="11" rx="3" fill="none" stroke="currentColor" stroke-width="1.2"/><rect x="2" y="2" width="13" height="7" rx="1.5"/><path d="M20.5 4v3" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
            </div>
          </div>

          <!-- Dynamic Island (iPhone 14 Pro, 15, 16) -->
          <div class="dynamic-island-container" id="dynamicIsland" title="iPhone Dynamic Island (คลิกเพื่อทดสอบ Animation)" onclick="pulseIsland()">
            <div class="dynamic-island-sensor"></div>
            <div class="dynamic-island-camera"></div>
          </div>

          <!-- Classic Apple Notch (iPhone 11 Series & 12 Series) -->
          <div class="classic-notch-container" id="classicNotch" title="Apple Classic Notch (iPhone 11 / 12)">
            <div class="notch-speaker-slit"></div>
            <div class="notch-camera-dot"></div>
          </div>

          <!-- Compact Apple Notch (iPhone 13 Series & iPhone 14) -->
          <div class="compact-notch-container" id="compactNotch" title="Apple Compact Notch (iPhone 13 / 14)">
            <div class="notch-speaker-slit"></div>
            <div class="notch-camera-dot"></div>
          </div>

          <!-- === Android Status Elements === -->
          <div class="android-status-bar" id="androidStatusBar">
            <div class="android-status-left">
              <span id="androidClock" style="font-weight: 700;">09:41</span>
              <!-- Notification Icon -->
              <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.9 2 2 2zm6-6v-5c0-3.07-1.63-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.64 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2z"/></svg>
            </div>
            <div class="android-status-right">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M12 3c-4.97 0-9 4.03-9 9 0 2.12.74 4.07 1.97 5.61L12 22l7.03-4.39C20.26 16.07 21 14.12 21 12c0-4.97-4.03-9-9-9z"/></svg>
              <span>LTE</span>
              <span>85%</span>
              <svg width="11" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M15.67 4H14V2h-4v2H8.33C7.6 4 7 4.6 7 5.33v15.33C7 21.4 7.6 22 8.33 22h7.33c.74 0 1.34-.6 1.34-1.33V5.33C17 4.6 16.4 4 15.67 4z"/></svg>
            </div>
          </div>

          <!-- Android Punch Hole Camera -->
          <div class="punch-hole-camera" id="punchHole"></div>

          <!-- Embedded Local Webpage (index.html) -->
          <iframe id="previewIframe" class="phone-viewport-iframe" src="index.html?v=20261013_v33"></iframe>

          <!-- Bottom Navigation Affordances -->
          <div class="ios-home-indicator-bar" id="iosHomeBar"></div>
          <div class="android-nav-bar" id="androidNavBar">
            <div class="android-gesture-pill"></div>
          </div>

        </div>

        <!-- iPhone SE Chin Bar -->
        <div class="iphone-se-bottom-bar" id="iphoneSeBottom">
          <div class="iphone-se-home-ring"></div>
        </div>

      </div>

    </div>
  </main>

  <!-- Quick Shortcut Floating Pill -->
  <footer class="shortcuts-bar">
    <div><span class="shortcut-tag">R</span> รีเฟรชโค้ดล่าสุด</div>
    <div><span class="shortcut-tag">P</span> พลิกหน้าจอ (Rotate)</div>
    <div><span class="shortcut-tag">B</span> เปิด/ปิด กรอบเครื่อง</div>
    <div><span class="shortcut-tag">F</span> ปรับขนาดพอดีจอ</div>
  </footer>

  <!-- Toast Notification (2D Flat) -->
  <div id="toast" class="simulator-toast">
    <span id="toastMsg">รีเฟรชสำเร็จ</span>
  </div>

  <script>
    // --- Complete Device Profiles (iPhone 11 through 16 + Android) ---
    const DEVICES = {
      // iPhone 16 Series
      iphone16promax: { name: 'iPhone 16 Pro Max', os: 'ios', w: 440, h: 956, radius: 52, cutType: 'island', network: '5G' },
      iphone16pro: { name: 'iPhone 16 Pro', os: 'ios', w: 393, h: 852, radius: 48, cutType: 'island', network: '5G' },
      iphone16plus: { name: 'iPhone 16 Plus', os: 'ios', w: 430, h: 932, radius: 48, cutType: 'island', network: '5G' },
      iphone16: { name: 'iPhone 16', os: 'ios', w: 393, h: 852, radius: 46, cutType: 'island', network: '5G' },

      // iPhone 15 Series
      iphone15promax: { name: 'iPhone 15 Pro Max', os: 'ios', w: 430, h: 932, radius: 50, cutType: 'island', network: '5G' },
      iphone15pro: { name: 'iPhone 15 Pro', os: 'ios', w: 393, h: 852, radius: 46, cutType: 'island', network: '5G' },
      iphone15plus: { name: 'iPhone 15 Plus', os: 'ios', w: 430, h: 932, radius: 48, cutType: 'island', network: '5G' },
      iphone15: { name: 'iPhone 15', os: 'ios', w: 393, h: 852, radius: 44, cutType: 'island', network: '5G' },

      // iPhone 14 Series
      iphone14promax: { name: 'iPhone 14 Pro Max', os: 'ios', w: 430, h: 932, radius: 48, cutType: 'island', network: '5G' },
      iphone14pro: { name: 'iPhone 14 Pro', os: 'ios', w: 393, h: 852, radius: 44, cutType: 'island', network: '5G' },
      iphone14plus: { name: 'iPhone 14 Plus', os: 'ios', w: 428, h: 926, radius: 44, cutType: 'compact-notch', network: '5G' },
      iphone14: { name: 'iPhone 14', os: 'ios', w: 390, h: 844, radius: 42, cutType: 'compact-notch', network: '5G' },

      // iPhone 13 Series
      iphone13promax: { name: 'iPhone 13 Pro Max', os: 'ios', w: 428, h: 926, radius: 44, cutType: 'compact-notch', network: '5G' },
      iphone13pro: { name: 'iPhone 13 Pro', os: 'ios', w: 390, h: 844, radius: 42, cutType: 'compact-notch', network: '5G' },
      iphone13: { name: 'iPhone 13', os: 'ios', w: 390, h: 844, radius: 42, cutType: 'compact-notch', network: '5G' },
      iphone13mini: { name: 'iPhone 13 mini', os: 'ios', w: 375, h: 812, radius: 40, cutType: 'compact-notch', network: '5G' },

      // iPhone 12 Series
      iphone12promax: { name: 'iPhone 12 Pro Max', os: 'ios', w: 428, h: 926, radius: 44, cutType: 'notch', network: '5G' },
      iphone12pro: { name: 'iPhone 12 Pro', os: 'ios', w: 390, h: 844, radius: 42, cutType: 'notch', network: '5G' },
      iphone12: { name: 'iPhone 12', os: 'ios', w: 390, h: 844, radius: 42, cutType: 'notch', network: '5G' },
      iphone12mini: { name: 'iPhone 12 mini', os: 'ios', w: 375, h: 812, radius: 40, cutType: 'notch', network: '5G' },

      // iPhone 11 Series
      iphone11promax: { name: 'iPhone 11 Pro Max', os: 'ios', w: 414, h: 896, radius: 40, cutType: 'notch', network: '4G LTE' },
      iphone11pro: { name: 'iPhone 11 Pro', os: 'ios', w: 375, h: 812, radius: 38, cutType: 'notch', network: '4G LTE' },
      iphone11: { name: 'iPhone 11', os: 'ios', w: 414, h: 896, radius: 38, cutType: 'notch', network: '4G LTE' },

      // iPhone SE & iPads
      iphonese: { name: 'iPhone SE (3rd / 2nd Gen)', os: 'ios', w: 375, h: 667, radius: 18, cutType: 'home-button', network: '5G' },
      ipadmini: { name: 'iPad Mini / Air', os: 'ios', w: 768, h: 1024, radius: 24, cutType: 'none', network: 'Wi-Fi' },
      ipadpro11: { name: 'iPad Pro 11"', os: 'ios', w: 834, h: 1194, radius: 26, cutType: 'none', network: '5G' },

      // Android Flagships
      galaxy24ultra: { name: 'Samsung Galaxy S24 Ultra', os: 'android', w: 412, h: 915, radius: 20, cutType: 'punch', network: '5G' },
      galaxy24: { name: 'Samsung Galaxy S24', os: 'android', w: 360, h: 780, radius: 26, cutType: 'punch', network: '5G' },
      pixel9pro: { name: 'Google Pixel 9 Pro', os: 'android', w: 412, h: 915, radius: 32, cutType: 'punch', network: '5G' },
      pixel9: { name: 'Google Pixel 9 / 8', os: 'android', w: 412, h: 892, radius: 30, cutType: 'punch', network: '5G' },
      compactandroid: { name: 'Compact Android', os: 'android', w: 360, h: 640, radius: 16, cutType: 'none', network: 'LTE' }
    };

    let currentDeviceKey = 'iphone16pro';
    let currentOS = 'ios';
    let isLandscape = false;
    let isBezelVisible = true;
    let currentScaleSetting = 'fit';

    // DOM Elements
    const body = document.body;
    const chassis = document.getElementById('phoneChassis');
    const screenEl = document.getElementById('phoneScreen');
    const iframe = document.getElementById('previewIframe');
    const scaleWrapper = document.getElementById('scaleWrapper');
    const stage = document.getElementById('simulatorStage');
    const dimensionPill = document.getElementById('dimensionPill');
    const deviceSelector = document.getElementById('deviceSelector');
    const scaleSelector = document.getElementById('scaleSelector');
    const orientationLabel = document.getElementById('orientationLabel');
    const bezelBtn = document.getElementById('bezelBtn');
    const toast = document.getElementById('toast');
    const toastMsg = document.getElementById('toastMsg');
    const toastIcon = document.getElementById('toastIcon');

    // Cutouts & Bars
    const iosStatusBar = document.getElementById('iosStatusBar');
    const iosHomeBar = document.getElementById('iosHomeBar');
    const dynamicIsland = document.getElementById('dynamicIsland');
    const classicNotch = document.getElementById('classicNotch');
    const compactNotch = document.getElementById('compactNotch');
    const iphoneSeTop = document.getElementById('iphoneSeTop');
    const iphoneSeBottom = document.getElementById('iphoneSeBottom');
    const networkBadge = document.getElementById('networkBadge');

    const androidStatusBar = document.getElementById('androidStatusBar');
    const androidNavBar = document.getElementById('androidNavBar');
    const punchHole = document.getElementById('punchHole');
    const liveClock = document.getElementById('liveClock');
    const androidClock = document.getElementById('androidClock');

    // Live Clock (Real-time updates)
    function updateClock() {
      const now = new Date();
      const hours = String(now.getHours()).padStart(2, '0');
      const mins = String(now.getMinutes()).padStart(2, '0');
      const timeStr = `${hours}:${mins}`;
      if (liveClock) liveClock.textContent = timeStr;
      if (androidClock) androidClock.textContent = timeStr;
    }
    setInterval(updateClock, 1000);
    updateClock();

    // Show Toast (2D Flat)
    function showToast(msg) {
      if (!toastMsg) return;
      toastMsg.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 1800);
    }

    // Switch OS (iOS vs Android)
    function switchOS(os) {
      currentOS = os;
      document.querySelectorAll('.os-tab-btn').forEach(btn => {
        btn.classList.toggle('active', btn.getAttribute('data-os') === os);
      });

      if (os === 'ios') {
        body.classList.remove('os-android');
        body.classList.add('os-ios');
        if (DEVICES[currentDeviceKey].os !== 'ios') {
          currentDeviceKey = 'iphone16pro';
          deviceSelector.value = 'iphone16pro';
        }
      } else {
        body.classList.remove('os-ios');
        body.classList.add('os-android');
        if (DEVICES[currentDeviceKey].os !== 'android') {
          currentDeviceKey = 'galaxy24';
          deviceSelector.value = 'galaxy24';
        }
      }

      applyDeviceSpecs();
      showToast('สลับโหมด: ' + (os === 'ios' ? 'iOS' : 'Android'));
    }

    // Quick Select Device
    function quickSelectDevice(key) {
      if (!DEVICES[key]) return;
      deviceSelector.value = key;
      changeDevice(key);
    }

    // Change Device Dropdown
    function changeDevice(key) {
      if (!DEVICES[key]) return;
      currentDeviceKey = key;
      const dev = DEVICES[key];
      
      // Auto-sync OS tab
      if (dev.os !== currentOS) {
        currentOS = dev.os;
        document.querySelectorAll('.os-tab-btn').forEach(btn => {
          btn.classList.toggle('active', btn.getAttribute('data-os') === currentOS);
        });
        body.classList.toggle('os-ios', currentOS === 'ios');
        body.classList.toggle('os-android', currentOS === 'android');
      }

      applyDeviceSpecs();
      showToast('เลือกรุ่น: ' + dev.name);
    }

    // Apply Dimensions & Cutout Hardware Chrome
    function applyDeviceSpecs() {
      const dev = DEVICES[currentDeviceKey];
      let width = isLandscape ? dev.h : dev.w;
      let height = isLandscape ? dev.w : dev.h;

      screenEl.style.width = width + 'px';
      screenEl.style.height = height + 'px';
      screenEl.style.borderRadius = isBezelVisible ? (dev.radius + 'px') : '12px';

      dimensionPill.textContent = `${width} × ${height} px`;
      if (networkBadge) networkBadge.textContent = dev.network || '5G';

      const isApple = dev.os === 'ios';

      // Hide all notch/island cutouts first
      dynamicIsland.style.display = 'none';
      classicNotch.style.display = 'none';
      compactNotch.style.display = 'none';
      punchHole.style.display = 'none';
      iphoneSeTop.style.display = 'none';
      iphoneSeBottom.style.display = 'none';

      let topSafePadding = 0;

      if (isApple) {
        iosStatusBar.style.display = (isBezelVisible && !isLandscape) ? 'flex' : 'none';
        iosHomeBar.style.display = (isBezelVisible && dev.cutType !== 'home-button') ? 'block' : 'none';

        androidStatusBar.style.display = 'none';
        androidNavBar.style.display = 'none';

        if (isBezelVisible && !isLandscape) {
          topSafePadding = 44;
          if (dev.cutType === 'island') {
            dynamicIsland.style.display = 'flex';
          } else if (dev.cutType === 'notch') {
            classicNotch.style.display = 'flex';
          } else if (dev.cutType === 'compact-notch') {
            compactNotch.style.display = 'flex';
          } else if (dev.cutType === 'home-button') {
            iphoneSeTop.style.display = 'flex';
            iphoneSeBottom.style.display = 'flex';
          }
        }
      } else {
        // Android
        iosStatusBar.style.display = 'none';
        iosHomeBar.style.display = 'none';

        androidStatusBar.style.display = (isBezelVisible && !isLandscape) ? 'flex' : 'none';
        androidNavBar.style.display = isBezelVisible ? 'flex' : 'none';

        if (isBezelVisible && !isLandscape) {
          topSafePadding = 34;
          if (dev.cutType === 'punch') {
            punchHole.style.display = 'block';
          }
        }
      }

      screenEl.style.paddingTop = topSafePadding + 'px';

      calculateScale();
    }

    // Toggle Orientation (Portrait / Landscape)
    function toggleOrientation() {
      isLandscape = !isLandscape;
      orientationLabel.textContent = isLandscape ? 'แนวนอน' : 'แนวตั้ง';
      document.getElementById('rotateBtn').classList.toggle('active', isLandscape);
      applyDeviceSpecs();
      showToast('หมุนหน้าจอ: ' + (isLandscape ? 'แนวนอน' : 'แนวตั้ง'));
    }

    // Toggle Bezel
    function toggleBezel() {
      isBezelVisible = !isBezelVisible;
      chassis.classList.toggle('frameless', !isBezelVisible);
      bezelBtn.classList.toggle('active', isBezelVisible);
      bezelBtn.innerHTML = `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="2" width="14" height="20" rx="3"/><path d="M12 18h.01"/></svg><span>กรอบเครื่อง: ${isBezelVisible ? 'เปิด' : 'ปิด'}</span>`;
      applyDeviceSpecs();
      showToast('กรอบเครื่อง: ' + (isBezelVisible ? 'เปิด' : 'ปิด'));
    }

    // Dynamic Island Click Pulse
    function pulseIsland() {
      dynamicIsland.style.transform = 'translateX(-50%) scale(1.15)';
      setTimeout(() => {
        dynamicIsland.style.transform = 'translateX(-50%) scale(1)';
      }, 250);
      showToast('Dynamic Island');
    }

    // Fast Reload Iframe
    function reloadPreview() {
      iframe.src = 'index.html?t=' + Date.now();
      showToast('รีโหลดหน้าจอเรียบร้อย');
    }

    // Change Scale
    function changeScale(val) {
      currentScaleSetting = val;
      calculateScale();
    }

    // Auto-Fit Calculation
    function calculateScale() {
      if (currentScaleSetting !== 'fit') {
        scaleWrapper.style.setProperty('--device-scale', currentScaleSetting);
        return;
      }

      const availableHeight = stage.clientHeight - 60;
      const dev = DEVICES[currentDeviceKey];
      const targetHeight = isLandscape ? dev.w : dev.h;
      const totalBoxHeight = isBezelVisible ? (targetHeight + (dev.cutType === 'home-button' ? 140 : 24)) : targetHeight;

      if (availableHeight > 0 && totalBoxHeight > 0) {
        let fit = availableHeight / totalBoxHeight;
        fit = Math.min(1.0, Math.max(0.40, Math.floor(fit * 100) / 100));
        scaleWrapper.style.setProperty('--device-scale', fit);
      }
    }

    window.addEventListener('resize', () => {
      if (currentScaleSetting === 'fit') {
        calculateScale();
      }
    });

    // Keyboard Shortcuts
    window.addEventListener('keydown', (e) => {
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.tagName === 'SELECT') {
        return;
      }

      const key = e.key.toLowerCase();
      if (key === 'r') {
        e.preventDefault();
        reloadPreview();
      } else if (key === 'p') {
        e.preventDefault();
        toggleOrientation();
      } else if (key === 'b') {
        e.preventDefault();
        toggleBezel();
      } else if (key === 'f') {
        e.preventDefault();
        scaleSelector.value = 'fit';
        changeScale('fit');
        showToast('ปรับขนาดพอดีหน้าจอ');
      }
    });

    // Initial setup
    applyDeviceSpecs();
  </script>
</body>
</html>
